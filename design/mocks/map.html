<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/screens.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>
  <body data-title="map.title" data-chrome="tabs">
    <div class="shell shell--map">
      <main class="main">
        <h1 class="visually-hidden" data-t="map.heading"></h1>
        <section class="stage" data-screen="map" data-default-state="default" data-state-attr>
          <div class="map" id="map" data-t-attr="aria-label:map.mapLabel"></div>

          <div class="maptop">
            <div class="mapsearch" role="search">
              <i data-icon="search"></i>
              <input
                class="mapsearch__input"
                role="combobox"
                aria-expanded="false"
                aria-controls="map-results"
                aria-autocomplete="list"
                id="map-search"
                type="search"
                autocomplete="off"
                data-go="search"
                data-t-attr="placeholder:map.search.placeholder;aria-label:map.search.label"
              />
              <button
                class="mapsearch__clear"
                type="button"
                data-go="default"
                data-when="search search-none"
                data-t-attr="aria-label:common.clear"
              >
                <i data-icon="x"></i>
              </button>
            </div>
            <button
              class="round"
              type="button"
              data-go="legend"
              data-t-attr="aria-label:map.legend"
            >
              <i data-icon="help"></i>
            </button>

            <p
              class="visually-hidden"
              role="status"
              data-when="search"
              data-t="map.search.count"
              data-v='{"n":5}'
            ></p>
            <div class="results" id="map-results" role="listbox" data-when="search">
              <div class="results__group" role="group" aria-labelledby="results-spots-h">
                <h2 class="results__title" id="results-spots-h" data-t="map.search.spots"></h2>
                <a class="results__item" role="option" href="spot.html?screen=detail&state=kittens">
                  <span class="results__icon"><i data-icon="pin"></i></span>
                  <span class="results__text"
                    ><strong data-t="demo.spot1.name"></strong
                    ><span class="small muted" data-t="demo.spot1.address"></span
                    ><span class="tag"
                      ><i data-icon="paw" data-class="icon--s"></i
                      ><span data-t="spot.tag.kittens"></span></span
                  ></span>
                </a>
                <a class="results__item" role="option" href="spot.html?screen=detail&state=green">
                  <span class="results__icon"><i data-icon="pin"></i></span>
                  <span class="results__text"
                    ><strong data-t="demo.spot4.name"></strong
                    ><span class="small muted" data-t="demo.spot4.address"></span
                  ></span>
                </a>
              </div>
              <div class="results__group" role="group" aria-labelledby="results-places-h">
                <h2 class="results__title" id="results-places-h" data-t="map.search.places"></h2>
                <a class="results__item" role="option" href="map.html">
                  <span class="results__icon"><i data-icon="map"></i></span>
                  <span class="results__text"
                    ><strong data-t="demo.place.street"></strong
                    ><span class="small muted"
                      ><span data-t="map.search.type.street"></span> ·
                      <span data-t="demo.place.streetCity"></span></span
                  ></span>
                </a>
                <a class="results__item" role="option" href="map.html">
                  <span class="results__icon"><i data-icon="map"></i></span>
                  <span class="results__text"
                    ><strong data-t="demo.place.address"></strong
                    ><span class="small muted"
                      ><span data-t="map.search.type.address"></span> ·
                      <span data-t="demo.place.streetCity"></span></span
                  ></span>
                </a>
                <a class="results__item" role="option" href="map.html">
                  <span class="results__icon"><i data-icon="map"></i></span>
                  <span class="results__text"
                    ><strong data-t="demo.place.city"></strong
                    ><span class="small muted" data-t="map.search.type.city"></span
                  ></span>
                </a>
              </div>
            </div>
            <div class="results results--none" role="status" data-when="search-none">
              <i data-icon="search" data-class="icon--l"></i>
              <strong data-t="map.search.none"></strong>
              <span class="small muted" data-t="map.search.noneHint"></span>
            </div>

            <!-- List view: spots to feed near the phone; red with kittens, red, the rest (D-103). -->
            <div class="results results--list" id="spot-list" data-when="list">
              <div class="results__group" role="group" aria-labelledby="list-h">
                <h2 class="results__title" id="list-h" data-t="map.list.title"></h2>
                <p class="results__hint small muted" data-t="map.list.sorted"></p>
                <a class="results__item" href="spot.html?screen=detail&state=kittens">
                  <span class="results__icon"><i data-icon="pin"></i></span>
                  <span class="results__text">
                    <span class="results__head"
                      ><strong data-t="demo.spot1.name"></strong
                      ><span
                        class="results__distance num small muted"
                        data-t="map.list.distance.m"
                        data-v='{"n":80}'
                      ></span
                    ></span>
                    <span class="results__meta"
                      ><span class="chip" data-level="red"
                        ><i data-icon="bowl-empty"></i><span data-t="map.legend.red"></span
                      ></span>
                      <span class="tag"
                        ><i data-icon="paw" data-class="icon--s"></i
                        ><span data-t="spot.tag.kittens"></span
                      ></span>
                    </span>
                  </span>
                </a>
                <a class="results__item" href="spot.html?screen=detail&state=red">
                  <span class="results__icon"><i data-icon="pin"></i></span>
                  <span class="results__text">
                    <span class="results__head"
                      ><strong data-t="demo.spot2.name"></strong
                      ><span
                        class="results__distance num small muted"
                        data-t="map.list.distance.m"
                        data-v='{"n":410}'
                      ></span
                    ></span>
                    <span class="results__meta"
                      ><span class="chip" data-level="red"
                        ><i data-icon="bowl-empty"></i><span data-t="map.legend.red"></span
                      ></span>
                    </span>
                  </span>
                </a>
                <a class="results__item" href="spot.html?screen=detail&state=orange">
                  <span class="results__icon"><i data-icon="pin"></i></span>
                  <span class="results__text">
                    <span class="results__head"
                      ><strong data-t="demo.spot3.name"></strong
                      ><span
                        class="results__distance num small muted"
                        data-t="map.list.distance.m"
                        data-v='{"n":210}'
                      ></span
                    ></span>
                    <span class="results__meta"
                      ><span class="chip" data-level="orange"
                        ><i data-icon="clock"></i><span data-t="map.legend.orange"></span
                      ></span>
                    </span>
                  </span>
                </a>
                <a class="results__item" href="spot.html?screen=detail&state=none">
                  <span class="results__icon"><i data-icon="pin"></i></span>
                  <span class="results__text">
                    <span class="results__head"
                      ><strong data-t="demo.station.name"></strong
                      ><span
                        class="results__distance num small muted"
                        data-t="map.list.distance.m"
                        data-v='{"n":300}'
                      ></span
                    ></span>
                    <span class="results__meta"
                      ><span class="chip" data-level="none"
                        ><i data-icon="dash"></i><span data-t="map.legend.none"></span
                      ></span>
                    </span>
                  </span>
                </a>
              </div>
            </div>
            <div class="results results--none" role="status" data-when="list-empty">
              <i data-icon="check" data-class="icon--l"></i>
              <strong data-t="map.list.empty"></strong>
              <span class="small muted" data-t="map.list.emptyHint"></span>
            </div>
          </div>

          <div class="mapbanner" data-when="zoom">
            <i data-icon="map"></i>
            <span data-t="map.zoomIn"></span>
          </div>
          <div class="mapbanner" data-when="empty">
            <i data-icon="info"></i>
            <span data-t="map.empty"></span>
          </div>
          <div class="mapbanner" data-when="locdenied">
            <i data-icon="locate-off"></i>
            <span class="mapbanner__text" data-t="map.locationOff"></span>
            <a
              class="btn btn--small"
              href="profile.html?screen=location-help"
              data-t="map.locationOn"
            ></a>
          </div>

          <div class="mapctl">
            <button
              class="round"
              type="button"
              data-go="list"
              data-unless="list list-empty"
              data-t-attr="aria-label:map.list"
            >
              <i data-icon="list"></i>
            </button>
            <button
              class="round"
              type="button"
              data-go="default"
              data-when="list list-empty"
              data-t-attr="aria-label:map.showMap"
            >
              <i data-icon="map"></i>
            </button>
            <button class="round" type="button" data-t-attr="aria-label:map.locate">
              <i data-icon="locate"></i>
            </button>
            <button
              class="round round--primary"
              type="button"
              data-go="plus"
              data-t-attr="aria-label:map.add"
              aria-haspopup="dialog"
            >
              <i data-icon="plus"></i>
            </button>
          </div>

          <div class="scrim" data-when="plus" data-go="default"></div>
          <aside class="sheet sheet--modal" role="dialog" aria-modal="true" data-when="plus">
            <h2 class="sheet__title" data-t="map.add.title"></h2>
            <a class="dialog__option" href="spot.html?screen=new">
              <span class="dialog__icon"><i data-icon="pin"></i></span>
              <span class="dialog__text"
                ><strong data-t="map.newSpot"></strong
                ><span class="small muted" data-t="map.newSpot.hint"></span
              ></span>
            </a>
            <a class="dialog__option" data-level="alert" href="alerts.html?screen=raise">
              <span class="dialog__icon"><i data-icon="siren"></i></span>
              <span class="dialog__text"
                ><strong data-t="map.raiseAlert"></strong
                ><span class="small muted" data-t="map.raiseAlert.hint"></span
              ></span>
            </a>
            <button
              class="btn btn--quiet"
              type="button"
              data-go="default"
              data-t="common.cancel"
            ></button>
          </aside>

          <aside class="sheet sheet--peek" data-when="spot">
            <div class="sheet__head">
              <div class="sheet__top">
                <div
                  class="photo photo--square photo--round sheet__photo"
                  data-tone="1"
                  role="img"
                  data-t-attr="aria-label:map.topPhoto"
                >
                  <i data-icon="cat"></i>
                  <span class="photo__likes"
                    ><i data-icon="paw"></i><span class="num">24</span></span
                  >
                </div>
                <div class="stack stack--2">
                  <h2 class="sheet__title" data-t="demo.spot1.name"></h2>
                  <p class="muted small" data-t="demo.spot1.address"></p>
                </div>
              </div>
              <button
                class="iconbtn"
                type="button"
                data-go="default"
                data-t-attr="aria-label:common.close"
              >
                <i data-icon="x"></i>
              </button>
            </div>
            <div class="cluster">
              <span class="chip" data-level="red"
                ><i data-icon="bowl-empty"></i><span data-t="map.chip.food.red"></span
              ></span>
              <span class="chip" data-level="green"
                ><i data-icon="check"></i><span data-t="map.chip.water.green"></span
              ></span>
            </div>
            <p class="muted small num" data-t="map.lastLog" data-v='{"n":26}'></p>
            <a
              class="btn btn--block"
              href="spot.html?screen=detail&state=red"
              data-t="map.openSpot"
            ></a>
          </aside>

          <!-- A pending custom spot, as an admin sees it. -->
          <aside
            class="sheet sheet--peek"
            data-when="spot-pending spot-pending-approve spot-pending-reject"
          >
            <div class="sheet__head">
              <div class="stack stack--2">
                <span class="tag tag--pending"
                  ><i data-icon="clock" data-class="icon--s"></i
                  ><span data-t="spot.tag.pending"></span
                ></span>
                <h2 class="sheet__title" data-t="demo.spot2.name"></h2>
                <p class="muted small" data-t="demo.spot2.address"></p>
              </div>
              <button
                class="iconbtn"
                type="button"
                data-go="default"
                data-t-attr="aria-label:common.close"
              >
                <i data-icon="x"></i>
              </button>
            </div>
            <p class="small muted" data-t="map.pendingBy" data-v='{"name":"Dana Katz"}'></p>
            <div class="adminrow">
              <button
                class="btn"
                type="button"
                data-go="spot-pending-approve"
                data-t="spot.admin.approve"
              ></button>
              <button
                class="btn btn--secondary"
                type="button"
                data-go="spot-pending-reject"
                data-t="spot.admin.reject"
              ></button>
            </div>
          </aside>
          <div class="scrim" data-when="spot-pending-approve spot-pending-reject"></div>
          <aside
            class="sheet sheet--modal"
            role="dialog"
            aria-modal="true"
            data-when="spot-pending-approve"
          >
            <h2 class="sheet__title" data-t="spot.admin.approve.confirmTitle"></h2>
            <p class="muted" data-t="spot.admin.approve.confirmText"></p>
            <button
              class="btn btn--lg"
              type="button"
              data-go="default"
              data-t="spot.admin.approve.confirmYes"
            ></button>
            <button
              class="btn btn--quiet"
              type="button"
              data-go="spot-pending"
              data-t="common.cancel"
            ></button>
          </aside>
          <aside
            class="sheet sheet--modal"
            role="dialog"
            aria-modal="true"
            data-when="spot-pending-reject"
          >
            <h2 class="sheet__title" data-t="spot.admin.reject.confirmTitle"></h2>
            <p class="muted" data-t="spot.admin.reject.confirmText"></p>
            <button
              class="btn btn--lg btn--danger"
              type="button"
              data-go="default"
              data-t="spot.admin.reject.confirmYes"
            ></button>
            <button
              class="btn btn--quiet"
              type="button"
              data-go="spot-pending"
              data-t="common.cancel"
            ></button>
          </aside>

          <aside class="sheet sheet--peek" data-when="alert">
            <div class="sheet__head">
              <div class="stack stack--2">
                <span class="chip" data-level="alert">
                  <i data-icon="siren"></i><span data-t="alerts.kind.danger"></span>
                </span>
                <h2 class="sheet__title" data-t="demo.alert1.note"></h2>
              </div>
              <button
                class="iconbtn"
                type="button"
                data-go="default"
                data-t-attr="aria-label:common.close"
              >
                <i data-icon="x"></i>
              </button>
            </div>
            <p class="small muted num">
              <span data-t="alerts.reportedAgo" data-v='{"n":2}'></span> ·
              <span data-t="alerts.distance.m" data-v='{"n":320}'></span>
            </p>
            <div class="cluster">
              <a class="btn" href="alerts.html?screen=detail" data-t="alerts.openAlert"></a>
              <a
                class="btn btn--secondary"
                href="https://www.google.com/maps/dir/?api=1&destination=32.0628,34.7691"
                target="_blank"
                rel="noopener"
                ><i data-icon="navigate"></i><span data-t="common.navigate"></span
              ></a>
            </div>
          </aside>

          <aside class="sheet" data-when="legend">
            <div class="sheet__head">
              <h2 class="sheet__title" data-t="map.legend"></h2>
              <button
                class="iconbtn"
                type="button"
                data-go="default"
                data-t-attr="aria-label:common.close"
              >
                <i data-icon="x"></i>
              </button>
            </div>
            <div class="legend" id="legend"></div>
            <p class="small muted" data-t="map.legendWorst"></p>
            <p class="small muted" data-t="map.credit"></p>
          </aside>
        </section>
      </main>
      <nav data-nav="map"></nav>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="locales/he.js"></script>
    <script src="locales/en.js"></script>
    <script src="locales/ar.js"></script>
    <script src="locales/ru.js"></script>
    <script src="icons.js"></script>
    <script src="mock.js"></script>
    <script src="demo.js"></script>
    <script src="pages/map.js"></script>
  </body>
</html>
