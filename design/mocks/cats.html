<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/screens.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>
  <body data-title="cats.title" data-chrome="tabs">
    <div class="shell">
      <main class="main">
        <!-- ============ Feed ============ -->
        <div data-screen="feed" data-chrome="tabs" data-default-state="default">
          <header class="topbar">
            <h1 class="topbar__title" data-t="cats.feed.title"></h1>
            <a
              class="iconbtn iconbtn--solid"
              href="cats.html?screen=post"
              data-t-attr="aria-label:cats.share.title"
            >
              <i data-icon="plus"></i>
            </a>
          </header>
          <div class="layout-2">
            <div class="page page--feed">
              <div class="feed">
                <div class="notice" data-when="noloc">
                  <i data-icon="locate"></i>
                  <div class="notice__body">
                    <strong id="feed-city"></strong>
                    <span data-t="cats.feed.city.text"></span>
                    <a href="profile.html?screen=location-help" data-t="cats.feed.city.action"></a>
                  </div>
                </div>
                <div class="notice" data-when="seen">
                  <i data-icon="info"></i>
                  <div class="notice__body"><span data-t="cats.feed.seenAll"></span></div>
                </div>

                <article class="post" data-when="ownreview">
                  <div class="post__media">
                    <div class="photo photo--square" data-tone="2">
                      <i data-icon="cat"></i>
                      <span class="chip photo__status" data-level="none"
                        ><i data-icon="clock"></i><span data-t="common.inReview"></span
                      ></span>
                    </div>
                  </div>
                  <div class="post__body">
                    <div class="post__title"><h2 data-t="demo.cat1.name"></h2></div>
                    <div class="post__who">
                      <span class="avatar avatar--s" data-t="demo.me.initials"></span>
                      <bdi data-t="demo.me.name"></bdi>
                    </div>
                    <p class="small muted" data-t="cats.feed.reviewNote"></p>
                    <p class="post__time small muted" data-t="cats.feed.now"></p>
                  </div>
                </article>

                <div id="posts" data-unless="loading empty"></div>

                <div class="feed" data-when="loading" aria-busy="true">
                  <div class="skeleton-post">
                    <div class="skeleton skeleton--media"></div>
                    <div class="skeleton skeleton--line"></div>
                    <div class="skeleton skeleton--line skeleton--short"></div>
                  </div>
                  <div class="skeleton-post">
                    <div class="skeleton skeleton--media"></div>
                    <div class="skeleton skeleton--line"></div>
                    <div class="skeleton skeleton--line skeleton--short"></div>
                  </div>
                </div>

                <div class="empty" data-when="empty">
                  <i data-icon="cat" data-class="icon--l"></i>
                  <h2 data-t="cats.feed.empty.title"></h2>
                  <p data-t="cats.feed.empty.text"></p>
                  <a class="btn" href="cats.html?screen=post" data-t="cats.post.cta"></a>
                </div>
              </div>
            </div>
            <aside class="context">
              <div class="notice">
                <i data-icon="info"></i>
                <div class="notice__body">
                  <strong data-t="cats.feed.how.title"></strong
                  ><span data-t="cats.feed.how.text"></span>
                </div>
              </div>
            </aside>
          </div>
        </div>

        <!-- ============ Post a photo of a cat ============ -->
        <div data-screen="post" data-chrome="page" data-default-state="choose">
          <header class="topbar">
            <a class="iconbtn" href="cats.html" data-t-attr="aria-label:common.back"
              ><i data-icon="back" data-class="icon--flip"></i
            ></a>
            <h1 class="topbar__title" data-t="cats.post.title"></h1>
          </header>

          <div class="process" role="status" data-when="uploading">
            <div class="process__row">
              <span class="spinner"></span>
              <div>
                <strong data-t="cats.post.uploading.title"></strong>
                <span class="small" data-t="cats.post.uploading.text"></span>
              </div>
            </div>
          </div>

          <div class="centered" data-when="inreview">
            <span class="illus"><i data-icon="clock"></i></span>
            <h2 data-t="cats.post.review.title"></h2>
            <p class="muted" data-t="cats.post.review.text"></p>
            <a class="btn" href="cats.html?state=ownreview" data-t="cats.post.review.back"></a>
          </div>

          <!-- Where was the photo taken: pick a feeding spot on the map or in the list, or say it was not at one. -->
          <div class="page page--narrow stack stack--4" data-when="picker picker-general">
            <div class="stack stack--2">
              <h2 data-t="cats.picker.title"></h2>
              <p class="muted" data-t="cats.picker.hint"></p>
            </div>
            <div class="picker-map">
              <div class="map" id="picker-map" data-t-attr="aria-label:cats.picker.map"></div>
            </div>
            <div class="field">
              <label
                class="visually-hidden"
                for="picker-search"
                data-t="cats.picker.search"
              ></label>
              <div class="searchbox">
                <i data-icon="search"></i>
                <input
                  class="searchbox__input"
                  id="picker-search"
                  type="search"
                  autocomplete="off"
                  data-t-attr="placeholder:cats.picker.search"
                />
              </div>
            </div>
            <fieldset class="stack stack--2">
              <legend class="visually-hidden" data-t="cats.picker.title"></legend>
              <div class="choices">
                <label class="choice choice--row">
                  <input type="radio" name="where" value="random" id="where-random" />
                  <span class="choice__tile">
                    <span class="avatar"><i data-icon="cat"></i></span>
                    <span class="pickrow__text"
                      ><strong data-t="cats.post.where.random"></strong
                      ><span class="small muted" data-t="cats.post.where.randomHint"></span
                    ></span>
                    <span class="choice__mark"><i data-icon="check"></i></span>
                  </span>
                </label>
              </div>
              <h2 class="picker__nearby" data-t="cats.picker.nearby"></h2>
              <div class="choices" id="picker-rows"></div>
            </fieldset>
          </div>

          <form
            class="page page--post stack stack--5"
            novalidate
            data-unless="inreview picker picker-general"
          >
            <div class="notice" data-level="red" data-when="nocat">
              <i data-icon="image-off"></i>
              <div class="notice__body">
                <strong data-t="cats.post.noCat.title"></strong
                ><span data-t="cats.post.noCat.text"></span>
              </div>
            </div>
            <div class="notice" data-level="none" data-when="limit">
              <i data-icon="clock"></i>
              <div class="notice__body">
                <strong data-t="cats.post.limit.title"></strong
                ><span data-t="cats.post.limit.text"></span>
              </div>
            </div>

            <div class="post-layout">
              <div class="stack stack--2">
                <button class="dropzone" type="button" data-when="choose limit nocat">
                  <span class="dropzone__inner"
                    ><span class="dropzone__camera"><i data-icon="camera"></i></span
                    ><span data-t="cats.post.photo.add"></span
                  ></span>
                </button>
                <div class="dropzone dropzone--filled" data-unless="choose limit nocat">
                  <div class="photo" data-tone="2"><i data-icon="cat"></i></div>
                  <button
                    class="btn btn--small btn--secondary dropzone__change"
                    type="button"
                    data-unless="uploading"
                  >
                    <i data-icon="camera" data-class="icon--s"></i>
                    <span data-t="cats.post.photo.change"></span>
                  </button>
                </div>
                <p class="field__hint" data-t="cats.post.photo.hint"></p>
              </div>

              <div class="post-layout__fields">
                <div class="field">
                  <label class="field__label" for="cat-name" data-t="cats.post.name.label"></label>
                  <input
                    class="input"
                    id="cat-name"
                    maxlength="40"
                    data-t-attr="placeholder:cats.post.name.placeholder"
                  />
                  <p class="field__hint" data-t="cats.post.name.hint" data-v='{"max":40}'></p>
                  <p class="field__error" data-when="noname">
                    <span data-t="cats.post.name.required"></span>
                  </p>
                </div>

                <div class="field">
                  <span class="field__label" id="where-label"
                    ><span data-t="cats.post.where.label"></span>
                    <span class="muted small" data-t="common.optionalLabel"></span
                  ></span>
                  <button
                    class="where-pick"
                    id="where-pick"
                    type="button"
                    data-go="picker"
                    aria-labelledby="where-label"
                  >
                    <i data-icon="pin"></i>
                    <span class="where-pick__text">
                      <span data-when="choose limit" data-t="cats.post.where.choose"></span>
                      <span
                        data-when="ready-spot ready-fixed uploading nocat noname"
                        data-t="demo.spot1.name"
                      ></span>
                      <span data-when="ready-random" data-t="cats.post.where.random"></span>
                      <span
                        class="where-pick__hint"
                        data-when="ready-random"
                        data-t="cats.post.where.randomHint"
                      ></span>
                    </span>
                    <i data-icon="chevron" data-class="icon--flip"></i>
                  </button>
                  <p class="field__hint" data-when="ready-fixed" data-t="cats.post.where.fixed"></p>
                </div>
              </div>
            </div>
          </form>
          <div class="footbar footbar--wide" data-unless="inreview picker picker-general">
            <button
              class="btn btn--lg"
              type="button"
              data-go="inreview"
              data-unless="uploading choose limit nocat"
              data-t="cats.post.submit"
            ></button>
            <button
              class="btn btn--lg"
              type="button"
              disabled
              data-when="choose limit nocat"
              data-t="cats.post.submit"
            ></button>
            <button class="btn btn--lg" type="button" aria-busy="true" data-when="uploading">
              <span class="spinner spinner--btn"></span><span data-t="cats.post.sending"></span>
            </button>
          </div>
          <div class="footbar footbar--wide" data-when="picker picker-general">
            <button
              class="btn btn--lg"
              type="button"
              id="picker-confirm"
              data-go="ready-spot"
              data-t="cats.picker.confirm"
            ></button>
          </div>
        </div>

        <!-- ============ One cat: photo and comments ============ -->
        <div data-screen="cat" data-chrome="page" data-default-state="default">
          <header class="topbar">
            <a class="iconbtn" href="cats.html" data-t-attr="aria-label:common.back"
              ><i data-icon="back" data-class="icon--flip"></i
            ></a>
            <h1 class="topbar__title" data-t="cats.cat.title"></h1>
            <button class="iconbtn" type="button" data-t-attr="aria-label:common.report">
              <i data-icon="flag"></i>
            </button>
          </header>
          <article class="post post--solo">
            <div class="post__media">
              <button
                class="post__open"
                type="button"
                data-go="fullscreen"
                data-t-attr="aria-label:cats.photo.open"
              >
                <span class="photo" data-tone="1"><i data-icon="cat"></i></span>
              </button>
              <span class="post__place"
                ><i data-icon="pin"></i><span data-t="demo.spot1.name"></span
              ></span>
            </div>
            <div class="post__body">
              <div class="post__title"><h2 data-t="demo.cat1.name"></h2></div>
              <div class="post__who">
                <span class="avatar avatar--s" data-t="demo.user1.initials"></span>
                <bdi data-t="demo.user1.name"></bdi>
              </div>
              <div class="post__actions">
                <button class="react" type="button" aria-pressed="true">
                  <i data-icon="paw"></i><span class="visually-hidden" data-t="cats.like"></span
                  ><span class="num">24</span>
                </button>
              </div>
              <p class="post__time small muted num" data-t="spot.ago.hours" data-v='{"n":2}'></p>
            </div>
          </article>

          <section class="page page--narrow comments">
            <h2 data-t="cats.cat.comments" data-v='{"n":3}'></h2>
            <div>
              <div class="comment">
                <span class="avatar" data-t="demo.user2.initials"></span>
                <div class="comment__body">
                  <div class="comment__meta">
                    <strong><bdi data-t="demo.user2.name"></bdi></strong
                    ><span class="num" data-t="spot.ago.hours" data-v='{"n":1}'></span>
                  </div>
                  <p data-t="demo.comment1"></p>
                </div>
              </div>
              <div class="comment">
                <span class="avatar" data-t="demo.user3.initials"></span>
                <div class="comment__body">
                  <div class="comment__meta">
                    <strong><bdi data-t="demo.user3.name"></bdi></strong
                    ><span class="num" data-t="spot.ago.hours" data-v='{"n":2}'></span>
                  </div>
                  <p data-t="demo.comment2"></p>
                </div>
              </div>
              <div class="comment" data-when="review">
                <span class="avatar" data-t="demo.me.initials"></span>
                <div class="comment__body">
                  <div class="comment__meta">
                    <strong><bdi data-t="demo.me.name"></bdi></strong
                    ><span class="chip" data-level="none"
                      ><i data-icon="clock"></i><span data-t="common.inReview"></span
                    ></span>
                  </div>
                  <p data-t="demo.comment3"></p>
                </div>
              </div>
            </div>
          </section>

          <div class="composer" data-unless="restricted limit">
            <div class="field composer__field">
              <input
                class="input"
                data-t-attr="placeholder:cats.cat.comment.placeholder;aria-label:cats.cat.comment.placeholder"
              />
            </div>
            <button
              class="iconbtn iconbtn--solid"
              type="button"
              data-t-attr="aria-label:common.send"
            >
              <i data-icon="send" data-class="icon--flip"></i>
            </button>
          </div>
          <div class="composer" data-when="restricted limit">
            <div class="notice" data-level="red">
              <i data-icon="restrict"></i>
              <div class="notice__body">
                <span
                  data-when="restricted"
                  data-t="chat.restricted.text"
                  data-v='{"date":"12.11"}'
                ></span
                ><span data-when="limit" data-t="cats.cat.comment.limit"></span>
              </div>
            </div>
          </div>

          <!-- A refused comment is a toast, so the text box does not move. -->
          <div class="toast toast--composer" role="alert" data-when="refused">
            <i data-icon="xcircle"></i>
            <div class="notice__body"><span data-t="common.refusedText"></span></div>
          </div>

          <!-- The photo, full screen. -->
          <div
            class="lightbox"
            role="dialog"
            aria-modal="true"
            data-when="fullscreen"
            data-t-attr="aria-label:cats.photo.full"
          >
            <button
              class="iconbtn lightbox__close"
              type="button"
              data-go="default"
              data-t-attr="aria-label:common.close"
            >
              <i data-icon="x"></i>
            </button>
            <div class="photo lightbox__photo" data-tone="1"><i data-icon="cat"></i></div>
          </div>
        </div>
      </main>
      <nav data-nav="explore"></nav>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="locales/he.js"></script>
    <script src="locales/en.js"></script>
    <script src="icons.js"></script>
    <script src="mock.js"></script>
    <script src="demo.js"></script>
    <script src="pages/cats.js"></script>
  </body>
</html>
