<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silent Whisker: compare looks</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/looks.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/viewer.css" />
  </head>
  <body class="looks">
    <!-- Design tooling, not the app: English only. The same real screens in each look. -->
    <header class="looks__head">
      <h1>Five looks, the same screens</h1>
      <p class="muted">
        Each look is only a set of colour and corner tokens. Pick one letter; the screens do not
        change.
      </p>
      <div class="cluster">
        <div class="seg seg--light" id="seg-lang" role="group" aria-label="Language"></div>
        <a class="btn btn--small btn--secondary" href="index.html">Open the full viewer</a>
      </div>
    </header>
    <main id="grid" class="looks__grid"></main>
    <script src="looks.js"></script>
  </body>
</html>
