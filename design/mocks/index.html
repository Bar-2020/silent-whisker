<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silent Whisker: screen viewer</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/viewer.css" />
  </head>
  <body class="viewer">
    <!-- Design tooling, not the app: English only, so its text is not part of the app's strings. -->
    <header class="viewer__bar on-dado">
      <strong class="viewer__title">Silent Whisker · every screen</strong>
      <!-- Phones only: the bar and the list leave no room for the screen itself. -->
      <button
        class="btn btn--small btn--on-dado viewer__toggle"
        id="toggle-bar"
        type="button"
      ></button>
      <div class="viewer__controls">
        <div
          class="seg viewer__device"
          role="group"
          aria-label="Device"
          id="seg-device"
        ></div>
        <div
          class="seg viewer__zoom"
          role="group"
          aria-label="Zoom"
          id="seg-zoom"
        ></div>
        <div class="seg" role="group" aria-label="Language" id="seg-lang"></div>
        <a
          class="btn btn--small btn--on-dado"
          href="design-system.html?lang=en"
          target="_blank"
          rel="noopener"
          >Design system</a
        >
      </div>
    </header>

    <nav class="viewer__list" aria-label="Screens" id="list"></nav>

    <main class="viewer__main">
      <div class="viewer__caption">
        <div class="viewer__headline">
          <h1 id="caption-title"></h1>
          <!-- Same tab, so the phone's back gesture returns here. -->
          <a class="btn btn--small btn--secondary" id="open-tab">Screen only</a>
        </div>
        <p class="muted" id="caption-detail"></p>
        <div class="cluster" id="caption-questions"></div>
      </div>
      <div class="viewer__stage" id="stage" data-zoom="100" data-device="phone">
        <iframe class="frame" id="frame" title="Screen preview"></iframe>
      </div>
    </main>

    <script src="viewer.js"></script>
  </body>
</html>
