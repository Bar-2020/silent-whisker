name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # fallow audit (part of `npm run verify:code`) diffs against the merge-base
          # with origin/main, which needs real history, not the default
          # single-commit shallow clone.
          fetch-depth: 0

      # Vite+: Node, dependency cache, frozen-lockfile install. Pinned by commit SHA; Node is
      # the current LTS, bumped by hand (Vite+ needs >=22.18).
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24.22.0
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      # With the `iac` job below this is `npm run verify`, the command the Stop hook and every
      # phase's Verification section refer to.
      - run: npm run verify:code

      # The deploy builds too; failing here keeps a broken build out of main.
      - run: npm run build

  # The Terraform half of `npm run verify`: fmt, validate, mock-AWS tests (offline). Needs only
  # Terraform and a shell, so it skips the Node and Vite+ install and runs beside `verify`.
  iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Pinned by commit SHA; the version matches the one used locally, bumped by hand.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      # The lock files hold a hash for Linux, which Terraform needs before it reuses a cached
      # provider. Without it each module downloads the AWS provider again.
      - run: npm run verify:iac

  # Every merge to main goes online (D-02). The repository variable DEPLOY_ENABLED switches it
  # on (set in the one-time setup, infra/README.md); set it to anything but true to pause deploys.
  # It must be a repository variable: a job's `if` runs before the environment's secrets load.
  deploy:
    needs: [verify, iac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The key is a secret of this environment, which only main may use.
    environment: production
    concurrency: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24.22.0
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      # The deploy user's key (infra/bootstrap/) can do nothing but switch into the deployer role.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 3600
          # Session tags would need sts:TagSession in the role's trust policy; nothing uses them.
          role-skip-session-tagging: true
          # Same as selected_region in shared/constants/aws.json; YAML cannot read it.
          aws-region: eu-north-1

      - run: npm run build

      - name: Terraform apply (infra/app)
        working-directory: infra/app
        env:
          # Where cost alerts go (D-52); a secret because the repository is public.
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          # The Google sign-in client (D-59): the id is a repository variable, the secret a
          # secret of this environment. Without both, Terraform leaves Google sign-in off.
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false -backend-config="bucket=silent-whisker-tfstate-$ACCOUNT"
          terraform apply -input=false -auto-approve

      # Order matters: add the new files, clear CloudFront's cache and wait until it is clear, and
      # only then remove old files, so a page still cached never points at a file that is gone.
      - name: Upload the site
        working-directory: infra/app
        run: |
          SITE="s3://$(terraform output -raw site_bucket)"
          DIST="$(terraform output -raw distribution_id)"
          aws s3 sync ../../frontend/dist "$SITE"
          ID=$(aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$ID"
          aws s3 sync ../../frontend/dist "$SITE" --delete
          echo "Live at $(terraform output -raw site_url)"

  review:
    needs: [verify, iac]
    # Disabled. To re-enable, restore:
    # if: success() && github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check rerun trigger
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.action }}" = "synchronize" ]; then
            msg=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" --jq .commit.message | head -n1 | xargs)
            if [ "$msg" != "RERUN CLAUDE CR" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.run == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Your instructions are in `.github/claude-review-prompt.md`, already checked out
            in the working directory. Read that file first and follow it exactly.

            If you cannot read it, do not attempt the review from memory. Post a comment on
            the PR saying the review instructions could not be loaded, and stop.

          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
