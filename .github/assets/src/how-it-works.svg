<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">How Silent Whisker works</title>
  <desc id="d">Three steps. One: the map shows where food or water is low, with green for fed, orange for due soon and red for overdue. Two: a log counts only if your phone is within 50 metres of the spot. Three: logs from far away are saved but never reset a spot's timers.</desc>
