  <title id="t">How Silent Whisker works</title>
  <desc id="d">Three steps. One: find a spot in need. Red pins need food or water and orange ones are running low. Two: feed the cats, fill the bowl and refill the water. Three: log it at the spot, and the pin turns green for everyone.</desc>
