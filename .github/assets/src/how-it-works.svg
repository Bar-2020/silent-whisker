    <stop offset="0" stop-color="#090b26"/><stop offset=".55" stop-color="#1f2564"/><stop offset="1" stop-color="#4a3a86"/>
  </linearGradient>
  <radialGradient id="moon" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#ffe5a3"/></radialGradient>
  <radialGradient id="moonglow"><stop offset="0" stop-color="#ffe9b0" stop-opacity=".38"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/></radialGradient>
  <radialGradient id="sigdisc"><stop offset="0" stop-color="#fffbe6"/><stop offset=".75" stop-color="#fff0bd"/><stop offset="1" stop-color="#ffe6a0"/></radialGradient>
  <radialGradient id="sigglow"><stop offset="0" stop-color="#fff3c8" stop-opacity=".34"/><stop offset="1" stop-color="#fff3c8" stop-opacity="0"/></radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
